<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="description" content="此情深处，红笺为无色">
    <meta name="theme-color" content="#f5f0e8">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>无色笺</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/password-gate.css">
    <link rel="stylesheet" href="css/opening-poem.css">
    <link rel="stylesheet" href="css/main-layout.css">
    <link rel="stylesheet" href="css/space-moments.css">
    <link rel="stylesheet" href="css/space-lovenotes.css">
    <link rel="stylesheet" href="css/space-habits.css">
    <link rel="stylesheet" href="css/easter-eggs.css">

    <script type="importmap">
    {
        "imports": {
            "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2"
        }
    }
    </script>
</head>
<body>
    <!-- ============================================================
    View 1: Password Gate (扉页)
    ============================================================ -->
    <section id="password-gate" class="view active paper-texture">
        <div class="gate-wrapper">
            <div class="gate-content">
                <p class="gate-poem">此情深处，红笺为无色</p>
                <p class="gate-source">—— 晏几道《思远人》</p>
                <div class="gate-input-group">
                    <input
                        type="password"
                        id="password-input"
                        class="gate-input"
                        inputmode="numeric"
                        pattern="[0-9]*"
                        maxlength="20"
                        placeholder=""
                        autocomplete="off"
                    >
                    <div class="gate-ink-line"></div>
                </div>
                <button id="password-submit" class="gate-submit">启 卷</button>
                <p id="gate-error" class="gate-error"></p>
            </div>
        </div>
    </section>

    <!-- ============================================================
    View 2: Opening Poem (开卷诗过渡层)
    ============================================================ -->
    <section id="opening-poem" class="view paper-texture">
        <div class="poem-wrapper">
            <div class="poem-lines">
                <p class="poem-line-main line-1">此情深处</p>
                <p class="poem-line-main line-2">红笺为无色</p>
                <p class="poem-line-source line-3">—— 晏几道</p>
            </div>
        </div>
    </section>

    <!-- ============================================================
    View 3: Main View (三空间)
    ============================================================ -->
    <section id="main-view" class="view paper-texture">
        <!-- Top poem bar (triple-click target for easter egg) -->
        <div id="top-poem-bar" class="top-poem-bar">
            <p class="poem-text" id="top-poem-text">应怜屐齿印苍苔</p>
            <p class="poem-subtext" id="top-poem-subtext"></p>
        </div>

        <!-- Bamboo scroll container -->
        <div id="bamboo-scroll" class="bamboo-scroll">
            <!-- Space 1: 展齿苍苔 -->
            <div class="space-panel" id="space-moments" data-space="0">
                <div class="space-header">
                    <h2 class="space-title">展齿苍苔</h2>
                    <p class="space-poem">应怜屐齿印苍苔</p>
                </div>
                <div class="space-body" id="moments-container">
                    <div class="loading-state">研墨中...</div>
                </div>
                <button class="ink-drop-fab" id="moments-add-btn" title="添加新的足迹">+</button>
            </div>

            <!-- Space 2: 春水温澜 -->
            <div class="space-panel water-ripple-bg" id="space-lovenotes" data-space="1">
                <div class="space-header">
                    <h2 class="space-title">春水温澜</h2>
                    <p class="space-poem">风乍起，吹皱一池春水</p>
                </div>
                <div class="space-body" id="lovenotes-container">
                    <div class="loading-state">研墨中...</div>
                </div>
                <button class="ink-drop-fab" id="lovenotes-add-btn" title="添加情话">+</button>
            </div>

            <!-- Space 3: 冷暖共知 -->
            <div class="space-panel" id="space-habits" data-space="2">
                <div class="space-header">
                    <h2 class="space-title">冷暖共知</h2>
                    <p class="space-poem">如人饮水，冷暖共知</p>
                </div>
                <div class="space-body" id="habits-container">
                    <div class="loading-state">研墨中...</div>
                </div>
            </div>
        </div>

        <!-- Space indicators -->
        <div class="space-indicators">
            <span class="space-dot active" data-index="0"></span>
            <span class="space-dot" data-index="1"></span>
            <span class="space-dot" data-index="2"></span>
        </div>

        <!-- Hidden scroll easter egg -->
        <div id="hidden-scroll" class="hidden-scroll-overlay">
            <div class="scroll-paper" id="scroll-paper">
                <div class="scroll-rod"></div>
                <div class="scroll-text" id="scroll-text"></div>
                <div class="scroll-seal">
                    <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
                        <rect x="2" y="2" width="44" height="44" rx="4" stroke="#c45a4a" stroke-width="2"/>
                        <text x="24" y="28" text-anchor="middle" fill="#c45a4a" font-size="14" font-family="serif">无色笺</text>
                    </svg>
                </div>
                <div class="scroll-rod"></div>
            </div>
        </div>
    </section>

    <!-- Scripts (ES modules, order matters for dependency resolution) -->
    <script type="module" src="js/config.js"></script>
    <script type="module" src="js/utils.js"></script>
    <script type="module" src="js/solar-term.js"></script>
    <script type="module" src="js/supabase.js"></script>
    <script type="module" src="js/state.js"></script>
    <script type="module" src="js/password-gate.js"></script>
    <script type="module" src="js/opening-poem.js"></script>
    <script type="module" src="js/bamboo-scroll.js"></script>
    <script type="module" src="js/moments.js"></script>
    <script type="module" src="js/love-notes.js"></script>
    <script type="module" src="js/habits.js"></script>
    <script type="module" src="js/easter-eggs.js"></script>
    <script type="module" src="js/app.js"></script>
</body>
</html>
